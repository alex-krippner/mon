name: Deploy web demo

# Builds the browser app and uploads it to Netlify. Needs two repository secrets:
#   NETLIFY_AUTH_TOKEN  a personal access token from Netlify (User settings > Applications)
#   NETLIFY_SITE_ID     the site's "Project ID" (Site configuration > General)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Gradle configures the Android modules too, and AGP downloads a missing platform only after
      # the licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the web app
        run: ./gradlew -q --console=plain :webApp:wasmJsBrowserDistribution

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          npx --yes netlify-cli@17 deploy --prod --no-build
          --dir=webApp/build/dist/wasmJs/productionExecutable
          --site="$NETLIFY_SITE_ID"
